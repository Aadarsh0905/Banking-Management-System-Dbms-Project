# ============================================================
# Banking Management System — Application Configuration
# ============================================================

spring.application.name=banking-management-system
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=${PORT:8080}
server.servlet.context-path=/api

# ── Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQLHOST:gateway01.ap-northeast-1.prod.aws.tidbcloud.com}}:${DB_PORT:${MYSQLPORT:4000}}/${DB_NAME:${MYSQLDATABASE:banking_db}}?useSSL=${DB_USE_SSL:true}&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:${MYSQLUSER:34f53Yxe3VE5yJg.root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:A0n3G4aj4q1dLOpn}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ── JWT ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:MySuperSecretKeyForBankingSystem2024ForJWTTokenGeneration}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# ── Mail ──────────────────────────────────────────────────
spring.mail.test-connection=false
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:aadarshranjan89@gmail.com}
spring.mail.password=${MAIL_PASS:ogzzddabrxfdezke}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
banking.mail.from=${MAIL_USER:aadarshranjan89@gmail.com}
banking.mail.from-name=BankPortal Digital Banking
banking.mail.api-key=${MAIL_API_KEY:}
banking.mail.api-provider=${MAIL_API_PROVIDER:brevo}

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packages-to-scan=com.banking.controller

# ── Actuator ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# ── File Upload ───────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
banking.upload.dir=${UPLOAD_DIR:./uploads}

# ── Security ──────────────────────────────────────────────
banking.security.max-login-attempts=5
banking.security.lockout-duration-minutes=30
banking.security.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,https://*.onrender.com}
banking.frontend.url=${FRONTEND_URL:}

# ── Stripe Payment Gateway ─────────────────────────────────
stripe.api.secret-key=${STRIPE_SECRET_KEY:}
stripe.api.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# ── Logging ───────────────────────────────────────────────
logging.level.com.banking=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
