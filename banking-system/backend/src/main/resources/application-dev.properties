# ============================================================
# Development Profile — overrides application.properties
# Activate with: --spring.profiles.active=dev
# ============================================================

# Show SQL queries in dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow DDL auto create for dev (change to validate/none in prod)
spring.jpa.hibernate.ddl-auto=update

# Disable security for actuator in dev
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Verbose logging in dev
logging.level.com.banking=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Mail — use Mailtrap for dev (https://mailtrap.io)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER:your_mailtrap_user}
spring.mail.password=${MAIL_PASS:your_mailtrap_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
