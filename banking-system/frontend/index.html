<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Banking Management System — Secure Online Banking" />
    <link rel="icon" type="image/svg+xml" href="/bank-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Banking Management System</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background-color: #000000; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="position: relative; width: 56px; height: 56px; margin-bottom: 24px;">
          <div style="width: 56px; height: 56px; border: 4px solid rgba(255, 102, 0, 0.2); border-top-color: #ff6600; border-radius: 50%; animation: bankSpin 1s linear infinite;"></div>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
            <div style="width: 10px; height: 10px; background-color: #ff6600; border-radius: 50%; box-shadow: 0 0 12px #ff6600;"></div>
          </div>
        </div>
        <div style="display: inline-block; padding: 4px 12px; border-radius: 9999px; background-color: rgba(255, 102, 0, 0.1); border: 1px solid rgba(255, 102, 0, 0.3); color: #ff6600; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 12px;">
          Render Cloud Free Tier
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 900; letter-spacing: -0.025em; margin: 0 0 8px 0; color: #ffffff;">
          BankPortal Digital Banking
        </h1>
        <p style="font-size: 0.85rem; color: #94a3b8; max-width: 440px; line-height: 1.6; margin: 0;">
          Connecting to application services... Initializing Spring Boot, TiDB database, and client interface.
        </p>
        <style>
          @keyframes bankSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
