# ============================================================
# Render Blueprint Specification (render.yaml)
# Full-Stack Banking Management System DBMS Project
# Render Free-Tier Web Service + Static Site with TiDB Cloud
# ============================================================
services:
  # ── 1. Spring Boot 3 Backend (Render Web Service) ────────
  - type: web
    name: banking-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/actuator/health
    envVars:
      - key: DB_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: banking_db
      - key: DB_USER
        value: 34f53Yxe3VE5yJg.root
      - key: DB_PASSWORD
        value: A0n3G4aj4q1dLOpn
      - key: DB_USE_SSL
        value: "true"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: MANAGEMENT_HEALTH_MAIL_ENABLED
        value: "false"
      - key: SPRING_MAIL_TEST_CONNECTION
        value: "false"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        value: aadarshranjan89@gmail.com
      - key: MAIL_PASS
        value: ogzzddabrxfdezke

  # ── 2. React Frontend (Render Static Site) ───────────────
  - type: web
    name: banking-frontend
    runtime: static
    buildCommand: cd banking-system/frontend && npm install && npm run build
    staticPublishPath: banking-system/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://banking-backend-tjem.onrender.com/api
