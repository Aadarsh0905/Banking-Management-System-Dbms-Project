# ============================================================
# Render Blueprint Specification (render.yaml)
# Full-Stack Banking Management System DBMS Project
# Deploy directly onto Render without external services
# ============================================================
services:
  # ── 1. MySQL 8 Database (Render Private Service) ─────────
  - type: pserv
    name: banking-mysql
    env: docker
    dockerfilePath: Dockerfile.mysql
    plan: starter
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: rootpassword
      - key: MYSQL_DATABASE
        value: banking_db
      - key: MYSQL_USER
        value: banking_user
      - key: MYSQL_PASSWORD
        value: banking_password

  # ── 2. Spring Boot 3 Backend (Render Web Service) ────────
  - type: web
    name: banking-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/actuator/health
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: banking-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: banking_db
      - key: DB_USER
        value: banking_user
      - key: DB_PASSWORD
        value: banking_password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,http://localhost:3000,http://localhost:5173"

  # ── 3. React Frontend (Render Static Site) ───────────────
  - type: web
    name: banking-frontend
    runtime: static
    buildCommand: cd banking-system/frontend && npm install && npm run build
    staticPublishPath: banking-system/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://banking-backend.onrender.com/api
