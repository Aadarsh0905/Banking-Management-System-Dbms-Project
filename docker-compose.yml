version: '3.9'

services:
  # MySQL 8 Database
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: banking_mysql:8.0
    container_name: banking_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-banking_db}
      MYSQL_USER: ${DB_USER:-banking_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-banking_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend (Java 21)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking_backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-banking_db}
      DB_USER: ${DB_USER:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD:-banking_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-MySuperSecretKeyForBankingSystem2024ForJWTTokenGeneration}
      SERVER_PORT: 8080
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,https://*.onrender.com"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: banking_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
